<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: rgba(255, 255, 255, 0.94);
        --accent: #0f766e;
        --accent-strong: #0b5f5a;
        --text: #17212d;
        --muted: #64748b;
        --danger: #b42318;
        --border: rgba(15, 23, 42, 0.12);
        --shadow: 0 24px 60px rgba(2, 8, 23, 0.28);
        --font: "Aptos", "Segoe UI Variable Text", "Trebuchet MS", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        font-family: var(--font);
        background:
          radial-gradient(circle at top left, rgba(45, 212, 191, 0.16), transparent 32%),
          radial-gradient(circle at bottom right, rgba(251, 191, 36, 0.14), transparent 30%),
          linear-gradient(135deg, #0f172a 0%, #101828 50%, #17212d 100%);
      }

      .login-card {
        width: min(420px, 100%);
        padding: 32px;
        border-radius: 28px;
        background: var(--card);
        box-shadow: var(--shadow);
      }

      .eyebrow {
        margin: 0 0 10px;
        font-size: 0.78rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 16px;
        margin-top: 26px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 0.95rem;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        font: inherit;
      }

      input:focus {
        outline: 2px solid rgba(15, 118, 110, 0.22);
        border-color: var(--accent);
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 14px 18px;
        font: inherit;
        font-weight: 700;
        color: #f8fffd;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .error {
        min-height: 24px;
        margin-top: 12px;
        color: var(--danger);
        font-size: 0.92rem;
      }
    </style>
    <script>
      if (window.localStorage.getItem("admin") === "true") {
        window.location.replace("/admin/dashboard.html");
      }
    </script>
  </head>
  <body>
    <main class="login-card">
      <p class="eyebrow">Admin Access</p>
      <h1>License Dashboard Login</h1>
      <p>Enter your admin password to open the protected licensing dashboard.</p>

      <form id="login-form">
        <label for="password">
          Password
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter admin password"
            required
          />
        </label>

        <button id="login-button" type="submit">Login</button>
      </form>

      <div id="error-message" class="error"></div>
    </main>

    <script>
      const form = document.querySelector("#login-form");
      const passwordInput = document.querySelector("#password");
      const loginButton = document.querySelector("#login-button");
      const errorMessage = document.querySelector("#error-message");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        errorMessage.textContent = "";
        loginButton.disabled = true;
        loginButton.textContent = "Checking...";

        try {
          const response = await fetch("/admin-login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              password: passwordInput.value,
            }),
          });

          const payload = await response.json();

          if (payload?.success) {
            window.localStorage.setItem("admin", "true");
            window.location.replace("/admin/dashboard.html");
            return;
          }

          errorMessage.textContent = "Incorrect password. Please try again.";
        } catch (_error) {
          errorMessage.textContent = "Login failed. Please try again.";
        } finally {
          loginButton.disabled = false;
          loginButton.textContent = "Login";
        }
      });
    </script>
  </body>
</html>
